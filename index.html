<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikola Nikolov</title>
<meta name="description" content="Nikola Nikolov — Full-Stack Developer, Sofia, Bulgaria.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-decor no-print" aria-hidden="true">
  <span class="bg-glyph" style="--x:6%; --y:10%; --d:0s;">{ }</span>
  <span class="bg-glyph" style="--x:88%; --y:6%; --d:-2s;">&lt;/&gt;</span>
  <span class="bg-glyph" style="--x:12%; --y:82%; --d:-6s;">01</span>
  <span class="bg-glyph" style="--x:92%; --y:70%; --d:-3.5s;">=&gt;</span>
  <span class="bg-glyph" style="--x:78%; --y:34%; --d:-1s;">;</span>
  <span class="bg-glyph" style="--x:4%; --y:46%; --d:-4.5s;">#</span>
  <span class="bg-glyph" style="--x:60%; --y:90%; --d:-7s;">( )</span>
  <span class="bg-glyph" style="--x:36%; --y:4%; --d:-5s;">i++</span>
</div>

<main id="top">

  <section class="hero">
    <p class="eyebrow" id="hero-tagline"></p>
    <h1 id="hero-name" class="no-print"></h1>
    <h1 id="hero-name-print" class="print-only"></h1>
    <p class="lede no-print" id="hero-lede"></p>
    <p class="lede print-only" id="hero-lede-print"></p>
  </section>

  <section id="experience">
    <h2>Experience</h2>
    <div id="experience-list"></div>
  </section>

  <section id="education">
    <h2>Education</h2>
    <div id="education-list"></div>
    <p class="certs" id="certs-list"></p>
  </section>

  <section id="skills">
    <h2>Skills</h2>
    <div class="skills-grid">
      <div>
        <h3>Technical</h3>
        <p id="skills-technical"></p>
      </div>
      <div>
        <h3>Working style</h3>
        <p id="skills-working"></p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>Get in touch</h2>
    <p class="lede">
      Always glad to talk about a project, a role, or just to trade notes on
      what you're building.
    </p>
    <ul class="contact-list">
      <li><a id="contact-email" href="#"></a></li>
      <li><a id="contact-github" href="#" target="_blank" rel="noopener">GitHub</a></li>
      <li><a id="contact-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </section>

  <p class="download-cv no-print">
    <button onclick="window.print()">Download CV (PDF)</button>
  </p>

</main>

<footer class="no-print">
  <p>Nikola Nikolov, Sofia, Bulgaria.</p>
</footer>

<script src="data.js"></script>
<script src="render.js"></script>
</body>
</html>
